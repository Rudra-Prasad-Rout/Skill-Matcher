<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S30 Staff Portal — Secure Admin Access</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .admin-auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .admin-auth-box {
      max-width: 440px;
      width: 100%;
      background: var(--s30-bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--s30-border);
      border-radius: var(--s30-radius-xl);
      padding: 40px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .admin-auth-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
    }
    .admin-badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="admin-auth-wrap">
    <div class="admin-auth-box">
      
      <!-- Top Shield Icon & Badge -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; margin: 0 auto 14px auto; border-radius: 16px; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.4); display: flex; align-items: center; justify-content: center; color: #38bdf8;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div class="admin-badge-top">🛡️ S30 Internal Administration</div>
        <h1 style="font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em;">Staff Portal Login</h1>
        <p style="font-size: 13px; color: var(--s30-text-secondary); margin-top: 4px;">Enter your staff credentials to access candidate approvals.</p>
      </div>

      {% if error %}
      <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px; flex-shrink: 0;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="{{ url_for('admin_login') }}" method="POST">
        
        <!-- Username Field -->
        <div class="s30-form-group">
          <label class="s30-form-label" for="admin_username">Admin Username</label>
          <div class="s30-input-wrap">
            <span class="s30-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="admin_username" 
              name="username" 
              class="s30-input" 
              placeholder="Username" 
              value="{{ username or '' }}"
              required
              autocomplete="off"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="s30-form-group" style="margin-bottom: 22px;">
          <label class="s30-form-label" for="admin_password">Admin Password</label>
          <div class="s30-input-wrap">
            <span class="s30-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="admin_password" 
              name="password" 
              class="s30-input" 
              placeholder="Password" 
              required
            >
          </div>
        </div>

        <button type="submit" class="s30-btn-primary" style="width: 100%; height: 46px; font-size: 14.5px;">
          <span>Authorize & Enter Admin Panel</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; margin-left: 6px;">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--s30-text-muted);">
        Authorized staff access only. Unauthorized attempts are monitored.
      </div>
    </div>
  </div>

</body>
</html>
