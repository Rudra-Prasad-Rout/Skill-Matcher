<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S30 Staff Portal — Secure Admin Access</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .admin-auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .admin-auth-box {
      max-width: 440px;
      width: 100%;
      background: #0c1322;
      border: 3px solid #38BDF8;
      border-radius: 10px;
      padding: 40px 36px;
      box-shadow: 8px 8px 0px #38BDF8;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="admin-auth-wrap">
    <div class="admin-auth-box">
      
      <!-- Top Shield Icon & Badge -->
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; margin: 0 auto 14px auto; border-radius: 8px; background: #38BDF8; border: 2px solid #000000; display: flex; align-items: center; justify-content: center; color: #000000; box-shadow: 3px 3px 0px #000000;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 30px; height: 30px;">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div style="margin-bottom: 10px;">
          <span class="neo-badge neo-badge-cyan">🛡️ S30 INTERNAL ADMINISTRATION</span>
        </div>
        <h1 style="font-size: 24px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; text-transform: uppercase;">Staff Portal Login</h1>
        <p style="font-size: 13px; color: #cbd5e1; margin-top: 4px; font-weight: 500;">Enter your staff credentials to access candidate approvals.</p>
      </div>

      {% if error %}
      <div style="background: #000000; border: 2px solid #E0536C; color: #E0536C; padding: 12px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; font-weight: 800; box-shadow: 3px 3px 0px #E0536C;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 18px; height: 18px; flex-shrink: 0;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="{{ url_for('admin_login') }}" method="POST">
        
        <!-- Username Field -->
        <div class="s30-form-group">
          <label class="s30-form-label" for="admin_username" style="color: #38BDF8; font-weight: 900; letter-spacing: 0.05em;">ADMIN USERNAME</label>
          <div class="s30-input-wrap">
            <span class="s30-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              name="username" 
              id="admin_username" 
              class="s30-input" 
              placeholder="" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div class="s30-form-group" style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="s30-form-label" for="admin_password" style="margin-bottom: 0; color: #38BDF8; font-weight: 900; letter-spacing: 0.05em;">SECURITY PASSWORD</label>
            <button type="button" onclick="togglePasswordVisibility()" style="background: none; border: none; color: #38BDF8; font-size: 11.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; text-transform: uppercase; letter-spacing: 0.05em;">
              <span id="eyeIconHeader">👁️</span>
              <span id="toggleTextHeader">SHOW PASSWORD</span>
            </button>
          </div>
          <div class="s30-input-wrap" style="position: relative;">
            <span class="s30-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              name="password" 
              id="admin_password" 
              class="s30-input" 
              placeholder="" 
              required
              autocomplete="current-password"
              style="padding-right: 48px;"
            >
            <!-- In-field Eye Toggle Button -->
            <button 
              type="button" 
              id="eyeToggleBtn" 
              onclick="togglePasswordVisibility()" 
              title="Show / Hide Password" 
              style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 4px; transition: all 0.15s ease;"
              onmouseover="this.style.color='#38BDF8'; this.style.background='rgba(0, 240, 255, 0.1)';"
              onmouseout="this.style.color='#94a3b8'; this.style.background='none';"
            >
              <svg id="eyeOpenSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeClosedSvg" viewBox="0 0 24 24" fill="none" stroke="#E0536C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="neo-btn neo-btn-cyan" style="width: 100%; padding: 13px; font-size: 14px;">
          <span>AUTHENTICATE & ENTER DESK &rarr;</span>
        </button>

      </form>

      <!-- Back to Main Site -->
      <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('landing_page') }}" style="font-size: 12.5px; color: #38BDF8; text-decoration: none; font-weight: 800;">
          &larr; Return to S30 Main Platform
        </a>
      </div>

    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('admin_password');
      const eyeOpen = document.getElementById('eyeOpenSvg');
      const eyeClosed = document.getElementById('eyeClosedSvg');
      const toggleText = document.getElementById('toggleTextHeader');
      const eyeIcon = document.getElementById('eyeIconHeader');

      if (!pwd) return;

      if (pwd.type === 'password') {
        pwd.type = 'text';
        if (eyeOpen) eyeOpen.style.display = 'none';
        if (eyeClosed) eyeClosed.style.display = 'block';
        if (toggleText) toggleText.innerText = 'HIDE PASSWORD';
        if (eyeIcon) eyeIcon.innerText = '🙈';
      } else {
        pwd.type = 'password';
        if (eyeOpen) eyeOpen.style.display = 'block';
        if (eyeClosed) eyeClosed.style.display = 'none';
        if (toggleText) toggleText.innerText = 'SHOW PASSWORD';
        if (eyeIcon) eyeIcon.innerText = '👁️';
      }
    }
  </script>

  <!-- Moving Background Floating Shapes -->
  <div style="position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;">
    <div style="position: absolute; top: 18%; left: 8%; font-size: 38px; color: #D9A726; animation: floatRotate1 15s infinite ease-in-out; opacity: 0.5; filter: drop-shadow(2px 2px 0px #000);">✦</div>
    <div style="position: absolute; top: 30%; right: 10%; font-size: 44px; color: #38BDF8; animation: floatRotate2 18s infinite ease-in-out; opacity: 0.45; filter: drop-shadow(2px 2px 0px #000);">⬡</div>
    <div style="position: absolute; bottom: 20%; left: 12%; font-size: 40px; color: #E0536C; animation: floatRotate3 16s infinite ease-in-out; opacity: 0.5; filter: drop-shadow(2px 2px 0px #000);">✚</div>
    <div style="position: absolute; bottom: 15%; right: 18%; font-size: 34px; color: #34A853; animation: floatRotate1 13s infinite ease-in-out; opacity: 0.5; filter: drop-shadow(2px 2px 0px #000);">◆</div>
  </div>

  <style>
    @keyframes floatRotate1 {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-22px) rotate(180deg) scale(1.1); }
      100% { transform: translateY(0px) rotate(360deg) scale(1); }
    }
    @keyframes floatRotate2 {
      0% { transform: translateY(0px) rotate(0deg) scale(1.1); }
      50% { transform: translateY(26px) rotate(-180deg) scale(0.95); }
      100% { transform: translateY(0px) rotate(-360deg) scale(1.1); }
    }
    @keyframes floatRotate3 {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      33% { transform: translate(16px, -18px) rotate(120deg); }
      66% { transform: translate(-16px, 14px) rotate(240deg); }
      100% { transform: translate(0px, 0px) rotate(360deg); }
    }
  </style>
</body>
</html>
