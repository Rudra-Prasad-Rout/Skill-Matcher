services:
  - type: web
    name: teamx-s30-platform
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GMAIL_USER
        value: teamx.contact.admin@gmail.com
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
